name: Deploy (GitHub default domain)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-gh"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: "/WEB/"   # 👈 让 Vite 以仓库子路径打包
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm install
      - run: npm run build

      # SPA 刷新 404 & 关闭 jekyll
      - run: cp dist/static/index.html dist/static/404.html
      - run: touch dist/static/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
