name: Deploy (Custom domain)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-gh"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 自定义域名必须是 "/"
    env:
      VITE_BASE: "/" 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - run: npm run build

      # SPA 刷新直达路由回退
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist    # ⚠️ 这里是 dist，不是 dist/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
