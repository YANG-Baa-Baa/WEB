name: Deploy to GitHub Pages (dist/static version)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-gh"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ✅ 自定义域名必须用 "/"
      VITE_BASE: "/"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite project
        run: npm run build

      # ✅ SPA 刷新路由回退 & 禁止 Jekyll
      - name: Add SPA fallback & disable Jekyll
        run: |
          cp dist/static/index.html dist/static/404.html
          touch dist/static/.nojekyll

      # ✅ 上传打包后的静态文件（dist/static）
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
